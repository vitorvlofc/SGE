{% extends 'base.html' %}

{% block content %}

{% include 'components/_product_metrics.html' %}
{% include 'components/_sales_metrics.html' %}

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<div class="row mt-4 justify-content-center">

    <div class="col-md-6 text-center">

        <h5 class="text-center mb-3">
            Valor de vendas (Últimos 7 dias)
        </h5>

        <canvas id="dailySalesChart"></canvas>

    </div>

    <div class="col-md-6 text-center">

        <h5 class="text-center mb-3">
            Quantidade de Vendas Diárias
        </h5>

        <canvas id="dailySalesQuantityChart"></canvas>

    </div>

</div>

<script>
    document.addEventListener("DOMContentLoaded", function () {

        var dailySalesData = JSON.parse('{{ daily_sales_data|safe }}');

        var dailySalesQuantityData = JSON.parse(
            '{{ daily_sales_quantity_data|safe }}'
        );

        // =========================
        // Gráfico de valor em vendas
        // =========================
        var ctxDailySales = document
            .getElementById('dailySalesChart')
            .getContext('2d');

        var dailySalesChart = new Chart(ctxDailySales, {

            type: 'line',

            data: {

                labels: dailySalesData.dates,

                datasets: [{
                    label: 'Valor em vendas',
                    data: dailySalesData.values,
                    fill: false,
                    borderColor: 'rgba(54, 162, 235, 1)',
                    borderWidth: 2,
                    tension: 0.5
                }]

            },

            options: {

                scales: {

                    y: {
                        beginAtZero: true
                    }

                }

            }

        });

        // ==================================
        // Gráfico de quantidade de vendas
        // ==================================
        var ctxDailySalesQuantity = document
            .getElementById('dailySalesQuantityChart')
            .getContext('2d');

        var dailySalesQuantityChart = new Chart(
            ctxDailySalesQuantity,
            {

                type: 'bar',

                data: {

                    labels: dailySalesQuantityData.dates,

                    datasets: [{
                        label: 'Quantidade de Vendas',
                        data: dailySalesQuantityData.values,
                        backgroundColor: 'rgba(255, 99, 132, 0.6)',
                        borderColor: 'rgba(255, 99, 132, 1)',
                        borderWidth: 1
                    }]

                },

                options: {

                    scales: {

                        y: {
                            beginAtZero: true
                        }

                    }

                }

            }
        );

    });
</script>


<div class="row mt-4 justify-content-center">

    <div class="col-md-6 text-center">

        <h5 class="mb-3">
            Produtos por Categoria
            <div class="mb4"></div>
        </h5>
        <div class="embed-responsive embed-responsive1by1" style="width: 400px; display: inline-block;">

        <canvas id="ProductByCategoryChart" class="embed-responsive-item"></canvas>

        </div>

    </div>

    <div class="col-md-6 text-center">

        <h5 class="mb-3">
            Produtos por Marca
            <div class="mb4"></div>
        </h5>
        <div style="width: 400px; display: inline-block;">

        <canvas id="ProductByBrandChart" class="embed-responsive-item"></canvas>

        </div>

    </div>

<script>

document.addEventListener("DOMContentLoaded", function () {

    var productCountByCategory = JSON.parse(
    '{{ graphic_product_category_metric|safe }}'
);

var productCountByBrand = JSON.parse(
    '{{ graphic_product_brand_metric|safe }}'
);

    // =========================
    // Gráfico por categoria
    // =========================
    var ctxCategory = document
    .getElementById('ProductByCategoryChart')
    .getContext('2d');

    var productByCategoryChart = new Chart(ctxCategory, {

        type: 'doughnut',

        data: {

            labels: Object.keys(productCountByCategory),

            datasets: [{
                data: Object.values(productCountByCategory),
                borderWidth: 1
            }]

        },

        options: {

            plugins: {

                legend: {
                    display: false
                }

            }

        }

    });

    // =========================
    // Gráfico por marca
    // =========================
    var ctxBrand = document
    .getElementById('ProductByBrandChart')
    .getContext('2d');

    var productByBrandChart = new Chart(ctxBrand, {

        type: 'doughnut',

        data: {

            labels: Object.keys(productCountByBrand),

            datasets: [{
                data: Object.values(productCountByBrand),
                borderWidth: 1
            }]

        },

        options: {

            plugins: {

                legend: {
                    display: false
                }

            }

        }

    });

});

</script>

{% endblock %}
